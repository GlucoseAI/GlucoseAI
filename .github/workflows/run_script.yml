name: Run Glucose AI Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas scikit-learn joblib "timesfm[torch]"

      - name: Run Gluroo synchronization
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: python script.py

      - name: Evaluate previous forecasts
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: python evaluate_forecasts.py

      - name: Analyze forecast accuracy
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: python analyze_forecast_accuracy.py

      - name: Build personalization dataset
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: python build_personalization_dataset.py

      - name: Train personalization V5
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: python train_personalization_v5.py

      - name: Train personalization V6.1
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: python train_personalization_v6.py

      - name: Run TimesFM forecast
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: python forecast.py
