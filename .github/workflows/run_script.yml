name: Run Glucose AI Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:


jobs:

  run-script:

    runs-on: ubuntu-latest


    steps:

      # =================================================
      # CHECKOUT
      # =================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # =================================================
      # PYTHON
      # =================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:
          python-version: '3.12'


      # =================================================
      # DEPENDENCIES
      # =================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests pandas "timesfm[torch]"


      # =================================================
      # GLUROO → SUPABASE
      # =================================================

      - name: Run Gluroo synchronization

        env:

          SUPABASE_API_KEY:
            ${{ secrets.SUPABASE_API_KEY }}

        run:

          python script.py


      # =================================================
      # EVALUATE PREVIOUS FORECASTS
      # =================================================

      - name: Evaluate previous forecasts

        env:

          SUPABASE_API_KEY:
            ${{ secrets.SUPABASE_API_KEY }}

        run:

          python evaluate_forecasts.py


      # =================================================
      # TIMESFM FORECAST
      # =================================================

      - name: Run TimesFM forecast

        env:

          SUPABASE_API_KEY:
            ${{ secrets.SUPABASE_API_KEY }}

        run:

          python forecast.py
