<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glucose AI</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #111827;
    }

    .container {
      max-width: 1050px;
      margin: 40px auto;
      padding: 0 18px;
    }

    h1 {
      margin-bottom: 4px;
    }

    .subtitle {
      color: #667085;
      margin-top: 0;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin: 24px 0;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
    }

    .label {
      color: #667085;
      font-size: 15px;
    }

    .value {
      font-size: 28px;
      font-weight: 700;
      margin-top: 8px;
    }

    .trend {
      font-size: 32px;
      margin-left: 8px;
    }

    .chart-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
    }

    .chart-wrap {
      position: relative;
      height: 520px;
    }

    #status {
      margin-top: 12px;
      color: #667085;
    }

    .legend-note {
      margin: 12px 0 0;
      color: #667085;
      font-size: 13px;
    }

    /* Run button */

    .run-button-container {
      text-align: center;
      margin: 24px 0;
    }

    #runForecastBtn {
      padding: 13px 25px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #111827;
      color: white;
      transition: opacity 0.2s;
    }

    #runForecastBtn:hover {
      opacity: 0.85;
    }

    #runForecastBtn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #runStatus {
      margin-top: 10px;
      color: #667085;
      font-size: 14px;
    }

    @media (max-width: 850px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .container {
        margin-top: 20px;
      }

      .chart-wrap {
        height: 420px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Glucose AI</h1>

  <p class="subtitle">
    Predikce glukózy pomocí TimesFM 3.0
  </p>

  <!-- Information cards -->

  <div class="cards">

    <div class="card">
      <div class="label">Aktuální glukóza</div>
      <div class="value" id="current">--</div>
    </div>

    <div class="card">
      <div class="label">Predikce za 60 minut</div>
      <div class="value" id="forecast60">--</div>
    </div>

    <div class="card">
      <div class="label">Trend</div>
      <div class="value">
        <span id="trendArrow">→</span>
        <span id="trendText">--</span>
      </div>
    </div>

    <div class="card">
      <div class="label">Poslední aktualizace</div>
      <div class="value" id="updated" style="font-size:20px">
        --
      </div>
    </div>

  </div>


  <!-- Run forecast button -->

  <div class="run-button-container">

    <button
      id="runForecastBtn"
      onclick="runForecast()"
    >
      ▶ Spustit novou předpověď
    </button>

    <div id="runStatus"></div>

  </div>


  <!-- Chart -->

  <div class="chart-card">

    <div class="chart-wrap">
      <canvas id="glucoseChart"></canvas>
    </div>

    <p class="legend-note">
      Graf zobrazuje posledních 24 hodin skutečných měření
      a 2 hodiny predikce.
      Referenční pásma jsou pouze orientační a nejsou určena
      pro rozhodování o léčbě.
    </p>

  </div>


  <div id="status">
    Načítám data…
  </div>

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://tpzwxutiveixprniptyh.supabase.co";

/*
 * SEM VLOŽ SVŮJ STÁVAJÍCÍ SUPABASE PUBLISHABLE KEY
 */
const SUPABASE_KEY =
  "sb_publishable_EJsUJovb-CBE2TQs25Dvpg_iVBuhMal";


/* =========================================================
   GITHUB
   ========================================================= */

/*
 * SEM VLOŽ GITHUB PERSONAL ACCESS TOKEN
 *
 * Token musí mít:
 * Repository permissions
 * → Actions
 * → Read and write
 */
const GITHUB_TOKEN =
  "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";


const GITHUB_REPO_OWNER = "GlucoseAI";
const GITHUB_REPO_NAME = "GlucoseAI";
const GITHUB_WORKFLOW = "run_script.yml";
const GITHUB_BRANCH = "main";


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let chart = null;


/* =========================================================
   SUPABASE HEADERS
   ========================================================= */

function supabaseHeaders() {

  return {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`
  };

}


/* =========================================================
   TIME FORMAT
   ========================================================= */

function fmtTime(ts) {

  return new Date(ts).toLocaleTimeString("cs-CZ", {
    hour: "2-digit",
    minute: "2-digit"
  });

}


/* =========================================================
   TREND
   ========================================================= */

function trendInfo(values) {

  if (values.length < 4) {
    return {
      arrow: "→",
      text: "stabilní"
    };
  }

  const a = values[values.length - 4];
  const b = values[values.length - 1];

  const delta = b - a;

  if (delta > 0.25) {

    return {
      arrow: "↑",
      text: "stoupá"
    };

  }

  if (delta < -0.25) {

    return {
      arrow: "↓",
      text: "klesá"
    };

  }

  return {
    arrow: "→",
    text: "stabilní"
  };

}


/* =========================================================
   REFERENCE BANDS
   ========================================================= */

const referenceBands = {

  id: "referenceBands",

  beforeDraw(chart) {

    const {
      ctx,
      chartArea,
      scales
    } = chart;

    if (!chartArea || !scales.y) {
      return;
    }

    const y = scales.y;

    const bands = [

      {
        from: y.min,
        to: Math.min(3.9, y.max)
      },

      {
        from: Math.max(3.9, y.min),
        to: Math.min(10.0, y.max)
      },

      {
        from: Math.max(10.0, y.min),
        to: y.max
      }

    ];

    ctx.save();

    bands.forEach((band, i) => {

      if (band.to <= band.from) {
        return;
      }

      const top =
        y.getPixelForValue(band.to);

      const bottom =
        y.getPixelForValue(band.from);

      ctx.fillStyle =
        i === 0
          ? "rgba(239, 68, 68, 0.08)"
          : i === 1
            ? "rgba(34, 197, 94, 0.05)"
            : "rgba(245, 158, 11, 0.08)";

      ctx.fillRect(
        chartArea.left,
        top,
        chartArea.right - chartArea.left,
        bottom - top
      );

    });

    ctx.restore();

  }

};


/* =========================================================
   RUN GITHUB WORKFLOW
   ========================================================= */

async function runForecast() {

  const button =
    document.getElementById("runForecastBtn");

  const status =
    document.getElementById("runStatus");


  button.disabled = true;

  button.textContent =
    "⏳ Spouštím...";

  status.textContent =
    "Spouštím GitHub Actions...";


  try {

    const url =
      `https://api.github.com/repos/` +
      `${GITHUB_REPO_OWNER}/` +
      `${GITHUB_REPO_NAME}/` +
      `actions/workflows/` +
      `${GITHUB_WORKFLOW}/dispatches`;


    const response = await fetch(
      url,
      {
        method: "POST",

        headers: {

          "Accept":
            "application/vnd.github+json",

          "Authorization":
            `Bearer ${GITHUB_TOKEN}`,

          "X-GitHub-Api-Version":
            "2022-11-28",

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({
          ref: GITHUB_BRANCH
        })

      }
    );


    if (!response.ok) {

      const error =
        await response.text();

      console.error(
        "GitHub API error:",
        error
      );

      throw new Error(
        `GitHub API HTTP ${response.status}`
      );

    }


    button.textContent =
      "✓ Předpověď spuštěna";

    status.textContent =
      "GitHub Actions právě zpracovává nová data.";


    /*
     * TimesFM workflow u tebe trvá přibližně
     * 1–2 minuty.
     *
     * Po 2,5 minutách znovu načteme data.
     */

    setTimeout(
      async () => {

        status.textContent =
          "Načítám novou předpověď...";

        await loadData();

        button.disabled = false;

        button.textContent =
          "▶ Spustit novou předpověď";

      },
      150000
    );


  } catch (error) {

    console.error(error);

    button.disabled = false;

    button.textContent =
      "❌ Chyba";

    status.textContent =
      "Nepodařilo se spustit GitHub Actions.";

  }

}


/* =========================================================
   LOAD DATA FROM SUPABASE
   ========================================================= */

async function loadData() {

  try {


    /*
     * Kontrola, aby se nezapomněl vložit key.
     */

    if (
      SUPABASE_KEY ===
      "SEM_VLOZ_SVUJ_SUPABASE_PUBLISHABLE_KEY"
    ) {

      throw new Error(
        "Do index.html je potřeba vložit Supabase publishable key."
      );

    }


    /*
     * Glucose data
     */

    const glucoseUrl =

      `${SUPABASE_URL}/rest/v1/G_Entries` +

      `?select=dateString,sgv_mmol` +

      `&order=dateString.desc` +

      `&limit=5000`;


    /*
     * Forecast data
     */

    const forecastUrl =

      `${SUPABASE_URL}/rest/v1/glucose_forecasts` +

      `?select=` +
      `forecast_time,` +
      `predicted_mmol,` +
      `p10_mmol,` +
      `p90_mmol` +

      `&order=forecast_time.asc` +

      `&limit=24`;


    /*
     * Load both simultaneously
     */

    const [
      gRes,
      fRes
    ] = await Promise.all([

      fetch(
        glucoseUrl,
        {
          headers:
            supabaseHeaders()
        }
      ),

      fetch(
        forecastUrl,
        {
          headers:
            supabaseHeaders()
        }
      )

    ]);


    if (!gRes.ok) {

      throw new Error(
        `G_Entries HTTP ${gRes.status}`
      );

    }


    if (!fRes.ok) {

      throw new Error(
        `glucose_forecasts HTTP ${fRes.status}`
      );

    }


    const glucose =
      await gRes.json();

    const forecast =
      await fRes.json();


    if (!glucose.length) {

      throw new Error(
        "Žádná glucose data."
      );

    }


    if (!forecast.length) {

      throw new Error(
        "Žádná forecast data."
      );

    }


    /*
     * Sort glucose chronologically
     */

    glucose.sort(
      (a, b) =>
        new Date(a.dateString) -
        new Date(b.dateString)
    );


    /*
     * Latest measurement
     */

    const latest =
      new Date(
        glucose[
          glucose.length - 1
        ].dateString
      );


    /*
     * Last 24 hours
     */

    const cutoff =
      new Date(
        latest.getTime() -
        24 * 60 * 60 * 1000
      );


    const recent =
      glucose.filter(
        x =>
          new Date(x.dateString) >=
          cutoff
      );


    /*
     * Actual values
     */

    const actualLabels =
      recent.map(
        x =>
          fmtTime(x.dateString)
      );


    const actualValues =
      recent.map(
        x =>
          Number(x.sgv_mmol)
      );


    /*
     * Forecast values
     */

    const forecastLabels =
      forecast.map(
        x =>
          fmtTime(x.forecast_time)
      );


    const forecastValues =
      forecast.map(
        x =>
          Number(x.predicted_mmol)
      );


    /*
     * P10 / P90 are still loaded.
     *
     * They remain available for future use,
     * but are NOT displayed on the chart.
     */

    const p10Values =
      forecast.map(
        x =>
          Number(x.p10_mmol)
      );


    const p90Values =
      forecast.map(
        x =>
          Number(x.p90_mmol)
      );


    /*
     * Current glucose
     */

    document.getElementById(
      "current"
    ).textContent =

      `${actualValues[
        actualValues.length - 1
      ].toFixed(2)} mmol/l`;


    /*
     * Forecast after 60 minutes
     *
     * 5-minute interval
     * 12th forecast point = 60 min
     */

    const index60 =
      Math.min(
        11,
        forecastValues.length - 1
      );


    document.getElementById(
      "forecast60"
    ).textContent =

      `${forecastValues[
        index60
      ].toFixed(2)} mmol/l`;


    /*
     * Trend
     */

    const t =
      trendInfo(actualValues);


    document.getElementById(
      "trendArrow"
    ).textContent =
      t.arrow;


    document.getElementById(
      "trendText"
    ).textContent =
      t.text;


    /*
     * Last update
     */

    document.getElementById(
      "updated"
    ).textContent =
      fmtTime(latest);


    /*
     * Chart labels
     */

    const labels = [

      ...actualLabels,

      ...forecastLabels

    ];


    /*
     * Bridge between actual and forecast
     */

    const bridge =
      actualValues[
        actualValues.length - 1
      ];


    /*
     * Actual line
     */

    const actualData = [

      ...actualValues,

      ...Array(
        forecastValues.length
      ).fill(null)

    ];


    /*
     * Forecast median
     */

    const medianData = [

      ...Array(
        actualValues.length - 1
      ).fill(null),

      bridge,

      ...forecastValues

    ];


    /*
     * P10 and P90 are kept here
     * for future use.
     */

    const p10Data = [

      ...Array(
        actualValues.length - 1
      ).fill(null),

      bridge,

      ...p10Values

    ];


    const p90Data = [

      ...Array(
        actualValues.length - 1
      ).fill(null),

      bridge,

      ...p90Values

    ];


    /*
     * Destroy previous chart
     */

    if (chart) {

      chart.destroy();

    }


    /*
     * Create chart
     */

    chart =
      new Chart(

        document.getElementById(
          "glucoseChart"
        ),

        {

          type: "line",

          data: {

            labels: labels,

            datasets: [

              /* Actual glucose */

              {

                label:
                  "Skutečná glukóza",

                data:
                  actualData,

                borderWidth: 2,

                pointRadius: 1.5,

                tension: 0.15,

                spanGaps: true

              },


              /* TimesFM prediction */

              {

                label:
                  "TimesFM predikce",

                data:
                  medianData,

                borderWidth: 2,

                borderDash:
                  [6, 4],

                pointRadius: 2,

                tension: 0.15

              },


              /*
               * P90
               *
               * Hidden intentionally.
               */

              {

                label:
                  "P90",

                data:
                  p90Data,

                borderWidth: 0,

                pointRadius: 0,

                fill: false,

                hidden: true

              },


              /*
               * P10
               *
               * Hidden intentionally.
               */

              {

                label:
                  "P10",

                data:
                  p10Data,

                borderWidth: 0,

                pointRadius: 0,

                fill: false,

                hidden: true

              }

            ]

          },


          options: {

            responsive: true,

            maintainAspectRatio: false,


            interaction: {

              mode: "index",

              intersect: false

            },


            scales: {

              y: {

                title: {

                  display: true,

                  text:
                    "Glukóza (mmol/l)"

                },

                suggestedMin: 3,

                suggestedMax: 12

              },


              x: {

                title: {

                  display: true,

                  text:
                    "Čas"

                },

                ticks: {

                  maxTicksLimit: 24

                }

              }

            },


            plugins: {

              legend: {

                labels: {

                  filter:
                    item =>
                      item.datasetIndex < 2

                }

              },


              tooltip: {

                callbacks: {

                  label(context) {

                    const value =
                      context.parsed.y;


                    if (
                      value == null
                    ) {

                      return "";

                    }


                    return (

                      `${context.dataset.label}: ` +

                      `${value.toFixed(2)} mmol/l`

                    );

                  }

                }

              }

            }

          },


          plugins: [

            referenceBands

          ]

        }

      );


    /*
     * Status
     */

    document.getElementById(
      "status"
    ).textContent =
      "Data načtena úspěšně.";


  } catch (err) {

    console.error(err);


    document.getElementById(
      "status"
    ).textContent =

      "Chyba při načítání dat: " +
      err.message;

  }

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

loadData();


/* =========================================================
   AUTOMATIC REFRESH EVERY 5 MINUTES
   ========================================================= */

setInterval(
  loadData,
  5 * 60 * 1000
);

</script>

</body>
</html>
